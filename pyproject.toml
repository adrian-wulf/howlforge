[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "howlforge"
version = "0.1.0"
description = "Self-hosted second brain: capture ideas anywhere, let AI organize them into a Markdown vault you own."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "HowlForge contributors" }]
keywords = ["second-brain", "pkm", "knowledge-base", "notes", "markdown", "obsidian", "llm", "self-hosted", "telegram-bot", "gamedev"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development",
    "Topic :: Text Processing :: Markup",
]

dependencies = [
    "litellm>=1.60.0",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "jinja2>=3.1",
    "python-frontmatter>=1.1",
    "python-dotenv>=1.0",
    "aiogram>=3.4",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
howlforge = "howlforge.cli:main"
howlforge-bot = "howlforge.bot:main"

[tool.setuptools.packages.find]
include = ["howlforge*"]

[tool.setuptools.package-data]
howlforge = ["prompts/*.j2", "templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
