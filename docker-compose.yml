services:
  api:
    build: .
    image: howlforge:dev
    container_name: howlforge-api
    env_file: .env
    command: ["uvicorn", "howlforge.server:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    volumes:
      - ./vault:/app/vault
      - ./howlforge:/app/howlforge
    restart: unless-stopped

  bot:
    build: .
    image: howlforge:dev
    container_name: howlforge-bot
    env_file: .env
    command: ["howlforge-bot"]
    volumes:
      - ./vault:/app/vault
      - ./howlforge:/app/howlforge
    restart: unless-stopped
