services:
  api:
    build: .
    image: howlforge:dev
    container_name: howlforge-api
    env_file: .env
    command: ["uvicorn", "howlforge.server:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    volumes:
      - ./vault:/app/vault
      - ./howlforge:/app/howlforge
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  bot:
    build: .
    image: howlforge:dev
    container_name: howlforge-bot
    env_file: .env
    command: ["howlforge-bot"]
    depends_on:
      - api
    volumes:
      - ./vault:/app/vault
      - ./howlforge:/app/howlforge
    restart: unless-stopped
