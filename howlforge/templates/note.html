<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HowlForge</title>
  <style>
    :root { --bg:#16181d; --panel:#1e2128; --border:#2b2f38; --text:#e6e8eb;
            --muted:#9aa0aa; --accent:#d97757; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
           background:var(--bg); color:var(--text); }
    header { padding:18px 24px; border-bottom:1px solid var(--border); display:flex;
             align-items:center; gap:12px; }
    header a { color:var(--accent); text-decoration:none; }
    main { padding:24px; max-width:860px; margin:0 auto; }
    .flash { display:none; padding:10px 14px; border-radius:8px; margin-bottom:14px; }
    .flash.ok { background:#1d3a26; color:#7fd29b; display:block; }
    .flash.err { background:#3a1d1d; color:#d97f7f; display:block; }
    label { display:block; font-size:12px; color:var(--muted); margin:12px 0 4px;
            text-transform:uppercase; letter-spacing:.04em; }
    input[type=text], select, textarea { width:100%; background:var(--panel); color:var(--text);
            border:1px solid var(--border); border-radius:8px; padding:8px 12px; font-size:14px; }
    textarea { resize:vertical; min-height:260px; font-family:ui-monospace,Menlo,Consolas,monospace;
               line-height:1.5; background:var(--bg); }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:0 16px; }
    .actions { display:flex; gap:10px; margin-top:18px; }
    button { background:var(--accent); color:#16181d; border:none; font-weight:600; cursor:pointer;
             border-radius:8px; padding:10px 16px; font-size:14px; }
    button.ghost { background:var(--panel); color:var(--text); border:1px solid var(--border); }
    button.danger { background:#8a3b3b; color:#fff; border:none; }
    .meta { color:var(--muted); font-size:12px; }
  </style>
</head>
<body>
  <header>
    <a href="/panel">{{ ui.back }}</a>
    <span style="margin-left:auto">{{ note.title }}</span>
  </header>
  <main>
    <div id="flash" class="flash"></div>
    <form id="editform">
      <div class="grid">
        <div>
          <label>{{ ui.title }}</label>
          <input type="text" name="title" value="{{ note.title }}">
          <label>{{ ui.col_project }}</label>
          <select name="project">
            <option value="">({{ ui.none }})</option>
            {% for p in projects %}<option value="{{ p }}" {% if p == note.project %}selected{% endif %}>{{ p }}</option>{% endfor %}
          </select>
        </div>
        <div>
          <label>{{ ui.col_status }}</label>
          <select name="status">
            {% for s in statuses %}<option value="{{ s }}" {% if s == note.status %}selected{% endif %}>{{ s }}</option>{% endfor %}
          </select>
          <label>{{ ui.col_priority }}</label>
          <select name="priority">
            {% for pr in priorities %}<option value="{{ pr }}" {% if pr == note.priority %}selected{% endif %}>{{ pr }}</option>{% endfor %}
          </select>
          <label>{{ ui.col_category }}</label>
          <select name="category">
            {% for c in categories %}<option value="{{ c }}" {% if c == note.category %}selected{% endif %}>{{ c }}</option>{% endfor %}
          </select>
        </div>
      </div>
      <label>{{ ui.body }}</label>
      <textarea name="body">{{ note.body }}</textarea>
      <div class="meta">{{ ui.file }}: <code>{{ note_path }}</code></div>
      <div class="actions">
        <button type="submit">{{ ui.save }}</button>
        <button type="button" class="ghost" onclick="history.back()">{{ ui.cancel }}</button>
        <button type="button" class="danger" id="deletebtn">{{ ui.delete_note }}</button>
      </div>
    </form>
  </main>
  <script>
    const flash = document.getElementById('flash');
    document.getElementById('editform').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const fd = new FormData(e.target);
      const body = { title: fd.get('title'), project: fd.get('project') || null,
                     status: fd.get('status'), priority: fd.get('priority'),
                     category: fd.get('category'), body: fd.get('body') };
      try {
        const path = decodeURIComponent(location.pathname.split('/panel/note/')[1]);
        const r = await fetch('/api/notes/'+encodeURIComponent(path), {
          method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
        if (!r.ok) { const d = await r.json().catch(()=>({})); throw new Error(d.detail||('HTTP '+r.status)); }
        flash.className='flash ok'; flash.textContent='{{ ui.saved }}';
        setTimeout(()=>location.reload(), 400);
      } catch(err){ flash.className='flash err'; flash.textContent='{{ ui.failed }}: '+err.message; }
    });

    document.getElementById('deletebtn').addEventListener('click', async ()=>{
      if (!confirm('{{ ui.confirm_delete_note }}')) return;
      const path = decodeURIComponent(location.pathname.split('/panel/note/')[1]);
      const r = await fetch('/api/notes/'+encodeURIComponent(path), { method:'DELETE' });
      if (r.ok) { location.href='/panel'; }
      else { const d = await r.json().catch(()=>({})); alert(d.detail||('HTTP '+r.status)); }
    });
  </script>
</body>
</html>
