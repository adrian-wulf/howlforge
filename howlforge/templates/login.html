<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HowlForge</title>
  <style>
    :root { --bg:#16181d; --panel:#1e2128; --border:#2b2f38; --text:#e6e8eb;
            --muted:#9aa0aa; --accent:#d97757; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
           font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
           background:var(--bg); color:var(--text); }
    .card { background:var(--panel); border:1px solid var(--border); border-radius:12px;
            padding:28px 32px; width:340px; }
    h1 { font-size:18px; margin:0 0 18px; }
    label { display:block; font-size:12px; color:var(--muted); margin-bottom:6px;
            text-transform:uppercase; letter-spacing:.04em; }
    input { width:100%; background:var(--bg); color:var(--text); border:1px solid var(--border);
            border-radius:8px; padding:10px 12px; font-size:14px; }
    button { width:100%; margin-top:16px; background:var(--accent); color:#16181d; border:none;
             font-weight:600; cursor:pointer; border-radius:8px; padding:11px; font-size:14px; }
    .err { color:#d97f7f; font-size:13px; margin-top:12px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>HowlForge</h1>
    <form method="post" action="/login">
      <label>{{ ui.password }}</label>
      <input type="password" name="password" autofocus required>
      <button type="submit">{{ ui.log_in }}</button>
    </form>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
  </div>
</body>
</html>
